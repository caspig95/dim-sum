<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>港式點心泰文發音</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background-color: #f9f9f9;
      padding: 20px;
      margin: 0;
    }
    .container {
      position: relative;
      display: inline-block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    img {
      display: block;
      max-width: 100%;
      height: auto;
    }
    area {
      cursor: pointer;
    }

    /* 上方雙行文字動態顯示區 */
    .text-display-box {
      margin: 15px auto 20px;
      padding: 12px 20px;
      max-width: 600px;
      background-color: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      min-height: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .text-display-box .line1 {
      font-size: 22px;
      font-weight: bold;
      color: #2b6cb0;
      margin-bottom: 4px;
    }
    .text-display-box .line2 {
      font-size: 16px;
      color: #4a5568;
    }
  </style>
</head>
<body>

  <h2>🥟 港式點心泰文點讀教學 🥟</h2>

  <!-- 雙行文字顯示區域 -->
  <div class="text-display-box">
    <div id="text-line1" class="line1">💡 請將滑鼠移至圖片文字上</div>
    <div id="text-line2" class="line2">將同步顯示泰文與中文翻譯並播放發音</div>
  </div>

  <div class="container">
    <img src="Dim Sum Vocabulary-260810.jpg" usemap="#image-map" alt="港式點心泰文單字">

    <map name="image-map">
      <!-- 1. รู้จัก 3 ประเภทติ่มซำ #認識 港式點心三大類別 -->
      <area coords="123,54,803,176" shape="rect" onmouseenter="showTextAndPlay('1-w.mp3', 'รู้จัก 3 ประเภทติ่มซำ', '#認識 港式點心三大類別')">
      
      <!-- 2. อาหารว่างสุดขึ้นชื่อของจีน 中式著名代表茶點 -->
      <area coords="471,187,760,225" shape="rect" onmouseenter="showTextAndPlay('2-w.mp3', 'อาหารว่างสุดขึ้นชื่อของจีน', '中式著名代表茶點')">
      
      <!-- 3. แผ่นแป้งห่อ 面皮包裹類 -->
      <area coords="6,207,173,255" shape="rect" onmouseenter="showTextAndPlay('3-w.mp3', 'แผ่นแป้งห่อ', '面皮包裹類')">
      
      <!-- 4. แผ่นแป้งม้วน 面皮捲成條狀類 -->
      <area coords="8,611,176,658" shape="rect" onmouseenter="showTextAndPlay('4-w.mp3', 'แผ่นแป้งม้วน', '面皮捲成條狀類')">
      
      <!-- 5. แป้งก้อนกลม 麵糰做成球狀類 -->
      <area coords="14,871,176,921" shape="rect" onmouseenter="showTextAndPlay('5-w.mp3', 'แป้งก้อนกลม', '麵糰做成球狀類')">

      <!-- 6. ขนมจีบ 燒賣 -->
      <area coords="40,408,127,440" shape="rect" onmouseenter="showTextAndPlay('6-w.mp3', 'ขนมจีบ', '燒賣')">
      
      <!-- 7. ฮะเก๋า 蝦餃 -->
      <area coords="291,409,360,440" shape="rect" onmouseenter="showTextAndPlay('7-w.mp3', 'ฮะเก๋า', '蝦餃')">
      
      <!-- 8. เสี่ยวหลงเปา 小籠包 -->
      <area coords="502,404,639,442" shape="rect" onmouseenter="showTextAndPlay('8-w.mp3', 'เสี่ยวหลงเปา', '小籠包')">
      
      <!-- 9. เกี๊ยว 餃子 -->
      <area coords="784,410,847,445" shape="rect" onmouseenter="showTextAndPlay('9-w.mp3', 'เกี๊ยว', '餃子')">
      
      <!-- 10. ขนมกุยช่าย 韭菜餃子 -->
      <area coords="142,525,269,555" shape="rect" onmouseenter="showTextAndPlay('10-w.mp3', 'ขนมกุยช่าย', '韭菜餃子')">
      
      <!-- 11. ซุปเกี๊ยว 灌湯餃 -->
      <area coords="388,521,486,557" shape="rect" onmouseenter="showTextAndPlay('11-w.mp3', 'ซุปเกี๊ยว', '灌湯餃')">
      
      <!-- 12. ฝันโก๋ 粉果 -->
      <area coords="677,525,745,558" shape="rect" onmouseenter="showTextAndPlay('12-w.mp3', 'ฝันโก๋', '粉果')">

      <!-- 13-1. ฟองเต้าหู้ม้วนทอด 腐皮捲(炸) -->
      <area coords="166,819,220,839" shape="rect" onmouseenter="showTextAndPlay('13-1-w.mp3', 'ฟองเต้าหู้ม้วนทอด', '腐皮捲(炸)')">
      
      <!-- 13-2. ฟองเต้าหู้ม้วนนึ่ง 鮮竹捲(蒸) -->
      <area coords="263,815,291,838" shape="rect" onmouseenter="showTextAndPlay('13-2-w.mp3', 'ฟองเต้าหู้ม้วนนึ่ง', '鮮竹捲(蒸)')">
      
      <!-- 14. เปาะเปี๊ยะทอด 春捲 -->
      <area coords="371,781,519,819" shape="rect" onmouseenter="showTextAndPlay('14-w.mp3', 'เปาะเปี๊ยะทอด', '春捲')">
      
      <!-- 15. ก๋วยเตี๋ยวหลอด 粉腸/腸粉 -->
      <area coords="607,784,779,819" shape="rect" onmouseenter="showTextAndPlay('15-w.mp3', 'ก๋วยเตี๋ยวหลอด', '粉腸 / 腸粉')">

      <!-- 16. หมั่นโถว 饅頭 -->
      <area coords="315,1013,411,1043" shape="rect" onmouseenter="showTextAndPlay('16-w.mp3', 'หมั่นโถว', '饅頭')">
      
      <!-- 17. ซาลาเปา 包子/叉燒包 -->
      <area coords="507,1014,600,1043" shape="rect" onmouseenter="showTextAndPlay('17-w.mp3', 'ซาลาเปา', '包子 / 叉燒包')">
      
      <!-- 18. ซาลาเปาไส้หมูแดง 叉燒包 -->
      <area coords="685,868,833,900" shape="rect" onmouseenter="showTextAndPlay('18-w.mp3', 'ซาลาเปาไส้หมูแดง', '叉燒包')">

      <!-- 19. ซาลาเปา แบบไม่มีไส้ 沒有餡料 -->
      <area coords="111,983,280,1020" shape="rect" onmouseenter="showTextAndPlay('19-w.mp3', 'ซาลาเปา แบบไม่มีไส้', '沒有餡料')">

      <!-- 20. มีไส้ข้างใน เช่น เนื้อ หรือผัก 裡面有包餡料，例如肉類或蔬菜 -->
      <area coords="630,989,856,1023" shape="rect" onmouseenter="showTextAndPlay('20-w.mp3', 'มีไส้ข้างใน เช่น เนื้อ หรือผัก', '裡面有包餡料，例如肉類或蔬菜')">
    </map>
  </div>

  <script>
    const player = new Audio();

    function showTextAndPlay(fileName, line1Text, line2Text) {
      // 1. 更新第一行（泰文）與第二行（中文）
      document.getElementById('text-line1').innerText = line1Text;
      document.getElementById('text-line2').innerText = line2Text;

      // 2. 重新播放聲音
      player.pause();
      player.currentTime = 0;
      player.src = fileName;
      player.play().catch(e => console.log('播放提示:', e));
    }
  </script>

  <!-- 自動縮放座標腳本 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>
  <script>
    imageMapResize();
  </script>

</body>
</html>
