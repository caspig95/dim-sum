<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>港式點心泰文發音</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background-color: #f9f9f9;
      padding: 20px;
      margin: 0;
    }
    .container {
      position: relative;
      display: inline-block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    img {
      display: block;
      max-width: 100%;
      height: auto;
    }
    area {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>🍴 港式點心泰文發音 🍴</h2>
  <p>😋 將滑鼠移至泰文區域即可播放泰文發音：</p>

  <div class="container">
    <img src="Dim Sum Vocabulary-260810.jpg" usemap="#image-map" alt="港式點心泰文單字">

    <map name="image-map">
      <!-- 1. รู้จัก 3 ประเภทติ่มซำ #認識 港式點心三大類別 -->
      <area alt="รู้จัก 3 ประเภทติ่มซำ" title="認識 港式點心三大類別" coords="123,54,803,176" shape="rect" onmouseenter="playMp3('1-w.mp3')">
      
      <!-- 2. อาหารว่างสุดขึ้นชื่อของจีน 中式著名代表茶點 -->
      <area alt="อาหารว่างสุดขึ้นชื่อของจีน" title="中式著名代表茶點" coords="471,187,760,225" shape="rect" onmouseenter="playMp3('2-w.mp3')">
      
      <!-- 3. แผ่นแป้งห่อ 面皮包裹類 -->
      <area alt="แผ่นแป้งห่อ" title="面皮包裹類" coords="6,207,173,255" shape="rect" onmouseenter="playMp3('3-w.mp3')">
      
      <!-- 4. แผ่นแป้งม้วน 面皮捲成條狀類 -->
      <area alt="แผ่นแป้งม้วน" title="面皮捲成條狀類" coords="8,611,176,658" shape="rect" onmouseenter="playMp3('4-w.mp3')">
      
      <!-- 5. แป้งก้อนกลม 麵糰做成球狀類 -->
      <area alt="แป้งก้อนกลม" title="麵糰做成球狀類" coords="14,871,176,921" shape="rect" onmouseenter="playMp3('5-w.mp3')">

      <!-- 6. ขนมจีบ 燒賣 -->
      <area alt="ขนมจีบ" title="燒賣" coords="40,408,127,440" shape="rect" onmouseenter="playMp3('6-w.mp3')">
      
      <!-- 7. ฮะเก๋า 蝦餃 -->
      <area alt="ฮะเก๋า" title="蝦餃" coords="291,409,360,440" shape="rect" onmouseenter="playMp3('7-w.mp3')">
      
      <!-- 8. เสี่ยวหลงเปา 小籠包 -->
      <area alt="เสี่ยวหลงเปา" title="小籠包" coords="502,404,639,442" shape="rect" onmouseenter="playMp3('8-w.mp3')">
      
      <!-- 9. เกี๊ยว 餃子 -->
      <area alt="เกี๊ยว" title="餃子" coords="784,410,847,445" shape="rect" onmouseenter="playMp3('9-w.mp3')">
      
      <!-- 10. ขนมกุยช่าย 韭菜餃子 -->
      <area alt="ขนมกุยช่าย" title="韭菜餃子" coords="142,525,269,555" shape="rect" onmouseenter="playMp3('10-w.mp3')">
      
      <!-- 11. ซุปเกี๊ยว 灌湯餃 -->
      <area alt="ซุปเกี๊ยว" title="灌湯餃" coords="388,521,486,557" shape="rect" onmouseenter="playMp3('11-w.mp3')">
      
      <!-- 12. ฝันโก๋ 粉果 -->
      <area alt="ฝันโก๋" title="粉果" coords="677,525,745,558" shape="rect" onmouseenter="playMp3('12-w.mp3')">

      <!-- 13-1. 腐皮捲 -->
      <area alt="腐皮捲" title="腐皮捲" coords="166,819,220,839" shape="rect" onmouseenter="playMp3('13-1-w.mp3')">
      
      <!-- 13-2. 鮮竹捲 -->
      <area alt="鮮竹捲" title="鮮竹捲" coords="263,815,291,838" shape="rect" onmouseenter="playMp3('13-2-w.mp3')">
      
      <!-- 14. เปาะเปี๊ยะทอด 春捲 -->
      <area alt="เปาะเปี๊ยะทอด" title="春捲" coords="371,781,519,819" shape="rect" onmouseenter="playMp3('14-w.mp3')">
      
      <!-- 15. ก๋วยเตี๋ยวหลอด 粉腸/腸粉 -->
      <area alt="ก๋วยเตี๋ยวหลอด" title="粉腸" coords="607,784,779,819" shape="rect" onmouseenter="playMp3('15-w.mp3')">

      <!-- 16. หมั่นโถว 饅頭 -->
      <area alt="หมั่นโถว" title="饅頭" coords="315,1013,411,1043" shape="rect" onmouseenter="playMp3('16-w.mp3')">
      
      <!-- 17. ซาลาเปา 叉燒包/包子 -->
      <area alt="ซาลาเปา" title="包子/叉燒包" coords="507,1014,600,1043" shape="rect" onmouseenter="playMp3('17-w.mp3')">
      
      <!-- 18. ซาลาเปาไส้หมูแดง 叉燒包 -->
      <area alt="ซาลาเปาไส้หมูแดง" title="叉燒包" coords="685,868,833,900" shape="rect" onmouseenter="playMp3('18-w.mp3')">
      
      <!-- 19. ซาลาเปา แบบไม่มีไส้ 沒有餡料 -->
      <area alt="ซาลาเปา แบบไม่มีไส้" title="沒有餡料" coords="280,1020,111,983" shape="rect" onmouseenter="playMp3('19-w.mp3')">

      <!-- 20. มีไส้ข้างใน เช่น เนื้อ หรือผัก 裡面有包餡料，例如肉類或蔬菜 -->
      <area alt="มีไส้ข้างใน เช่น เนื้อ หรือผัก" title="裡面有包餡料，例如肉類或蔬菜" coords="630,989,856,1023" shape="rect" onmouseenter="playMp3('20-w.mp3')">
    </map>
  </div>

  <script>
    const player = new Audio();

    function playMp3(fileName) {
      player.pause();
      player.currentTime = 0;
      player.src = fileName;
      player.play().catch(e => console.log('播放提示:', e));
    }
  </script>

  <!-- 自動縮放座標腳本 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>
  <script>
    imageMapResize();
  </script>

</body>
</html>
