<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>港式點心</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background-color: #f9f9f9;
      padding: 20px;
      margin: 0;
    }
    .container {
      position: relative;
      display: inline-block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    img {
      display: block;
      max-width: 100%;
      height: auto;
    }
    area {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>🍴 泰文單字(AI發音) 🍴</h2>
  <p>😋 請將滑鼠移至圖片泰文上：</p>

  <div class="container">
    <img src="Dim Sum Vocabulary-260810.jpg" usemap="#image-map" alt="港式點心泰文單字">

    <map name="image-map">
      <!-- 1. รู้จัก 3 ประเภทติ่มซำ #認識 港式點心三大類別 -->

      <!-- 2. อาหารว่างสุดขึ้นชื่อของจีน 中式著名代表茶點 -->
      <area alt="อาหารว่างสุดขึ้นชื่อของจีน" title="อาหารว่างสุดขึ้นชื่อของจีน

      <!-- 20. มีไส้ข้างใน เช่น เนื้อ หรือผัก 裡面有包餡料，例如肉類或蔬菜 -->
      <area alt="มีไส้ข้างใน เช่น เนื้อ หรือผัก" title="มีไส้ข้างใน เช่น เนื้อ หรือผัก
裡面有包餡料，例如肉類或蔬菜" coords="630,989,856,1023" shape="rect" onmouseenter="playMp3('20-w.mp3')">
    </map>
  </div>

  <script>
    const player = new Audio();

    function playMp3(fileName) {
      player.pause();
      player.currentTime = 0;
      player.src = fileName;
      player.play().catch(e => console.log('播放提示:', e));
    }
  </script>

  <!-- 自動縮放座標腳本 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>
  <script>
    imageMapResize();
  </script>

</body>
</html>
